---
- name: Check if files directory exists
  delegate_to: localhost
  ansible.builtin.stat:
    path: "{{ role_path }}/files"
  register: files_dir_stat
  become: false

- name: Find all files in builder files directory
  delegate_to: localhost
  ansible.builtin.find:
    paths: "{{ role_path }}/files"
    recurse: true
    file_type: file
  register: builder_files
  when: files_dir_stat.stat.exists and files_dir_stat.stat.isdir
  become: false

- name: Sync .spec files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ builder_build_dir }}/SPECS/{{ item.path | basename }}"
    owner: "{{ builder_user }}"
    group: "{{ builder_user }}"
    mode: "0644"
  loop: "{{ builder_files.files | default([]) }}"
  when:
    - builder_files is defined
    - builder_files.files is defined
    - item.path is search('\.spec$')
  become: false

- name: Sync source files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ builder_build_dir }}/SOURCES/{{ item.path | basename }}"
    owner: "{{ builder_user }}"
    group: "{{ builder_user }}"
    mode: "0644"
  loop: "{{ builder_files.files | default([]) }}"
  when:
    - builder_files is defined
    - builder_files.files is defined
    - not (item.path is search('\.spec$'))
  become: false
