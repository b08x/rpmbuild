---
- name: Starting builder tasks
  ansible.builtin.debug:
    msg: "Starting builder tasks"
  tags: ["builder", "always"]

- name: Import build environment tasks
  ansible.builtin.import_tasks:
    file: build_env.yml
  when: builder_create_directories | default(true) | bool
  tags: ["builder", "directories", "configuration"]

- name: Import file sync tasks
  ansible.builtin.import_tasks:
    file: sync_files.yml
  tags: ["builder", "sync"]
