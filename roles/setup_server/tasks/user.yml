---
- name: "Create mock group"
  ansible.builtin.group:
    name: mock
    state: present
  tags: ["setup-server", "user-setup"]

- name: "Add user to mock group"
  ansible.builtin.user:
    name: "{{ setup_server_user.name }}"
    groups: "{{ setup_server_user.groups }}"
    append: true
  tags: ["setup-server", "user-setup"]
