---
# RPM Development Environment role defaults

# User configuration for RPM development
setup_server_user:
  name: "{{ user.name | default(ansible_user_id) }}"
  groups: ["mock"]
  create_home: true

# Mock configuration
mock_config:
  enable_network: true
  enable_bootstrap: true
  use_host_resolv: false
  cache_topdir: /var/cache/mock
  root_cache_enable: true
  yum_cache_enable: true
  dnf_cache_enable: true
  cleanup_on_success: true
  cleanup_on_failure: false


# Mock build targets — distribution-specific defaults loaded from vars/<dist>.yml
# Override per-host or per-group as needed.
mock_targets: "{{ _mock_targets | default([]) }}"

# Package installation control
setup_server_install_packages: true
setup_server_setup_user: true
setup_server_setup_mock: true
